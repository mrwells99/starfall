name: Test, build, deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Retained server + Windows + Linux release tag (sha-1a2b3c4). Leave blank to build from this ref."
        required: false
        type: string

# Least privilege by default; jobs widen it only where they must.
permissions:
  contents: read

# Never let two deploys race onto the droplet. Builds for older commits are
# cancelled, but an in-flight deploy is allowed to finish.
concurrency:
  group: starfall-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.5.1-stable
  GODOT_SHA512: 5bccbed65a94b82c7c319fdb15719ee8113a6e503976cc54e16f1c61fe95f3d74e5e40b8449b5bb89ff7f424574c20af01a4f5ef08b389e4dc338b245185b0b9
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------- tests ---
  test:
    name: Tests
    runs-on: ubuntu-24.04
    if: github.event.inputs.tag == ''
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check suite result labels before starting Godot
        run: python3 tests/check_suite_contracts.py

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sSL -o godot.zip "$url"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          install -m 0755 "Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Godot version
        run: godot --version

      # A fresh checkout has no .godot/imported/, and `--script` runs do not
      # trigger an import — they just fail to open every .ctex. This was
      # invisible until the project gained its first real assets: before the
      # ability icons there was nothing to import.
      - name: Import project assets
        run: godot --headless --path . --import

      # Two agents in one repository will eventually commit a file that
      # preloads a script the other has not committed. Godot only finds out at
      # load time, and only on a clean clone — so it surfaces here as the whole
      # game failing to parse, naming a file that exists fine on the author's
      # machine.
      - name: Every referenced resource is committed
        run: python3 tests/check_references.py

      - name: Parse check
        run: |
          python3 tests/check_presenter_indentation.py
          godot --headless --path . --check-only --script scripts/arena.gd
          godot --headless --path . --check-only --script scripts/champion_model.gd
          godot --headless --path . --check-only --script tests/network_peer.gd

      - name: Test runner rejects hidden script failures
        run: python3 tests/check_suite_runner_test.py

      - name: Arena mesh integrity
        run: ./tests/check_suite.sh "Arena LOD checks" godot --headless --path . --script tests/arena_lod_test.gd

      - name: Combat integration
        run: ./tests/check_suite.sh "Combat checks" godot --headless --path . --script tests/combat_test.gd

      - name: Menu, availability, rematch and frame-budget checks
        run: ./tests/check_suite.sh "Polish checks" godot --headless --path . --script tests/polish_test.gd

      - name: Eliminated player and spectator checks
        run: ./tests/check_suite.sh "Spectator checks" godot --headless --path . --script tests/spectator_test.gd

      - name: Personal resource HUD checks
        run: ./tests/check_suite.sh "Resource meter checks" godot --headless --path . --script tests/resource_meter_test.gd

      - name: Minimal nameplates and thin resource bars
        run: ./tests/check_suite.sh "Nameplate checks" godot --headless --path . --script tests/nameplate_test.gd

      - name: Independent crowd control diminishing returns
        run: ./tests/check_suite.sh "Diminishing returns checks" godot --headless --path . --script tests/diminishing_returns_test.gd

      - name: Movement gestures, ordering, and jump reliability
        run: ./tests/check_suite.sh "Movement controls checks" godot --headless --path . --script tests/movement_controls_test.gd

      - name: Smooth fractional camera zoom
        run: ./tests/check_suite.sh "Camera zoom checks" godot --headless --path . --script tests/camera_zoom_test.gd

      - name: Comfort, practice, and feedback checks
        run: ./tests/check_suite.sh "Quality of life checks" godot --headless --path . --script tests/quality_of_life_test.gd

      - name: Team frames and combat text checks
        run: ./tests/check_suite.sh "Team HUD checks" godot --headless --path . --script tests/team_hud_test.gd

      - name: Champion introduction and practice checks
        run: ./tests/check_suite.sh "Champion introduction checks" godot --headless --path . --script tests/champion_introduction_test.gd

      - name: Fulcrum windows and routed Vanguard Charge
        run: |
          ./tests/check_suite.sh "Fulcrum Meditation checks" godot --headless --path . --script tests/fulcrum_meditation_test.gd
          ./tests/check_suite.sh "Vanguard Charge checks" godot --headless --path . --script tests/vanguard_charge_test.gd

      - name: Aimed Solar Flare and directional Blink charges
        run: ./tests/check_suite.sh "Ember abilities checks" godot --headless --path . --script tests/ember_abilities_test.gd

      - name: Outlaw combos and character presentation
        run: |
          ./tests/check_suite.sh "Outlaw ability checks" godot --headless --path . --script tests/outlaw_abilities_test.gd
          ./tests/check_suite.sh "Outlaw balance checks" godot --headless --path . --script tests/outlaw_balance_test.gd
          ./tests/check_suite.sh "Outlaw presentation checks" godot --headless --path . --script tests/outlaw_presentation_test.gd
          ./tests/check_suite.sh "Outlaw local match checks" godot --headless --path . --script tests/outlaw_local_match_test.gd
          ./tests/check_suite.sh "Outlaw aim preview checks" godot --headless --path . --script tests/outlaw_aim_test.gd
          ./tests/check_suite.sh "Outlaw detonation checks" godot --headless --path . --script tests/outlaw_detonation_test.gd
          ./tests/check_suite.sh "Outlaw detonation input checks" godot --headless --path . --script tests/outlaw_detonation_input_test.gd
          ./tests/check_suite.sh "Sensitivity checks" godot --headless --path . --script tests/sensitivity_test.gd
          ./tests/check_suite.sh "Outlaw lasso checks" godot --headless --path . --script tests/outlaw_lasso_test.gd
          ./tests/check_suite.sh "Lasso pose checks" godot --headless --path . --script tests/lasso_pose_test.gd

      - name: Saved ability bars remain on screen
        run: ./tests/check_suite.sh "Hotbar viewport checks" godot --headless --path . --script tests/hotbar_viewport_test.gd

      - name: Kick immunity cast-bar colors
        run: ./tests/check_suite.sh "Cast bar checks" godot --headless --path . --script tests/cast_bar_test.gd

      - name: Body hitbox fit and aimed cooldown foundation
        run: |
          ./tests/check_suite.sh "Hitbox pose checks" godot --headless --path . --script tests/hitbox_pose_test.gd
          ./tests/check_suite.sh "Expanded hitbox checks" godot --headless --path . --script tests/expanded_hitboxes_test.gd
          ./tests/check_suite.sh "Aimed combat checks" godot --headless --path . --script tests/aimed_combat_test.gd

      # These bind fixed UDP ports and must not overlap — hence one step, in order.
      - name: Networked suites (sequential)
        run: |
          set -euo pipefail
          python3 tests/run_reconnect.py
          python3 tests/run_network.py
          python3 tests/run_network.py --test-team
          python3 tests/run_network.py --test-latency
          python3 tests/run_network.py --test-movement --test-latency --test-drop-jump
          python3 tests/run_charge_network.py --test-latency
          python3 tests/run_ember_network.py --test-latency
          python3 tests/run_outlaw_network.py --test-latency
          python3 tests/run_detonation_network.py --test-latency
          python3 tests/run_detonation_network.py --test-world --test-rtt-ms=138
          python3 tests/run_detonation_network.py --test-world --test-rtt-ms=138 --test-miss
          python3 tests/run_lasso_network.py --test-latency
          python3 tests/run_lasso_network.py --test-latency --test-air
          python3 tests/run_lasso_network.py --test-latency --test-ledge=up
          python3 tests/run_lasso_network.py --test-latency --test-ledge=down
          python3 tests/run_trinket_network.py
          python3 tests/run_aimed_network.py --test-latency
          python3 tests/run_six.py
          python3 tests/run_dedicated.py
          python3 tests/run_polish.py
          python3 tests/run_lobby.py
          python3 tests/run_world.py
          ./tests/check_suite.sh "World checks" godot --headless --path . --script tests/world_test.gd

      - name: World Ascension and vertical camera regression checks
        run: |
          ./tests/check_suite.sh "Starwalk checks" godot --headless --path . --script tests/world_starwalk_test.gd
          ./tests/check_suite.sh "Camera orbit checks" godot --headless --path . --script tests/camera_orbit_test.gd

      # ui_test drives real mouse capture and cursor positioning, so it refuses
      # --headless. Xvfb gives it a real (virtual) window; Mesa provides the
      # software GL that the gl_compatibility renderer needs.
      - name: Install virtual display for the UI suite
        run: |
          set -euo pipefail
          # All dependencies below come from Ubuntu. Do not refresh unrelated
          # runner repositories (e.g. Chrome), whose metadata can be out of sync.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=3
          )
          sudo apt-get "${apt_sources[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_sources[@]}" install -y --no-install-recommends \
            xvfb libgl1 libglu1-mesa libxcursor1 libxinerama1 libxrandr2 libxi6 \
            libxkbcommon0 fontconfig

      - name: UI suite (Xvfb)
        timeout-minutes: 3
        run: |
          ./tests/check_suite.sh "UI checks" \
            xvfb-run -a --server-args="-screen 0 1280x800x24" \
            godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tests/ui_test.gd

      # Icons and champion models also need a real window.
      - name: Ability art suite (Xvfb)
        run: |
          ./tests/check_suite.sh "Ability art checks" \
            xvfb-run -a --server-args="-screen 0 1280x800x24" \
            godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tests/ability_art_test.gd

      - name: Map suite (Xvfb)
        run: |
          ./tests/check_suite.sh "Map checks" \
            xvfb-run -a --server-args="-screen 0 1280x800x24" \
            godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tests/map_test.gd

      - name: Vanguard presentation suite (Xvfb)
        run: |
          ./tests/check_suite.sh "Model Forge presentation" \
            xvfb-run -a --server-args="-screen 0 1280x800x24" \
            godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tests/vanguard_presentation_test.gd

      # The server hard-rejects clients whose Config.VERSION differs. Shipping a
      # protocol change without bumping it lets stale clients connect and
      # desync, which is far harder to diagnose than a refused connection.
      - name: Warn if gameplay changed without a VERSION bump
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to compare against; skipping."; exit 0
          fi
          changed=$(git diff --name-only "$before" HEAD -- scripts/ || true)
          if [ -n "$changed" ] && git diff "$before" HEAD -- scripts/config.gd | grep -q '^[-+]const VERSION'; then
            echo "Config.VERSION was bumped."
          elif [ -n "$changed" ]; then
            echo "::warning title=Config.VERSION unchanged::scripts/ changed but Config.VERSION did not. Old clients will still be accepted by the new server."
          fi

  # Build both desktop clients alongside tests and the server image.
  windows:
    name: Windows launcher and game
    runs-on: windows-latest
    if: github.event.inputs.tag == ''
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test updater on Windows
        working-directory: launcher
        run: go test -v ./updater
      - name: Test release packaging and promotion
        run: python -m unittest discover -s tools/release -p "test_*.py" -v
      - name: Build launcher and check its real Windows UI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          Push-Location launcher
          go build -trimpath -ldflags="-s -w -H windowsgui" -o ../build/StarfallLauncher.exe ./cmd/starfall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $p = Start-Process build/StarfallLauncher.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Launcher UI did not finish its smoke check' }
          if ($p.ExitCode -ne 0) { throw "Launcher failed: $($p.ExitCode)" }
      - name: Cache verified Godot tools
        uses: actions/cache@v4
        with:
          path: ~/starfall-godot-windows
          key: godot-windows-${{ env.GODOT_VERSION }}-v1
      - name: Install Windows export tools
        run: python tools/release/install_windows_tools.py
      - name: Import, export, and launch the exported game
        shell: pwsh
        run: |
          & $env:GODOT_WINDOWS --headless --path . --import 2>&1 | Tee-Object build/import.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:GODOT_WINDOWS --headless --path . --export-release 'Windows Desktop' build/windows/Starfall.exe 2>&1 | Tee-Object build/export.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Start-Process build/windows/Starfall.exe -ArgumentList '--headless','--quit-after','120','--log-file',"$PWD/build/export-smoke.log" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Exported game did not complete startup' }
          if ($p.ExitCode -ne 0) { throw "Exported game failed: $($p.ExitCode)" }
          Get-Content build/export-smoke.log
          if (Select-String -Path build/import.log,build/export.log,build/export-smoke.log -Pattern 'SCRIPT ERROR:|^ERROR:') { throw 'Godot reported errors' }
      - name: Package verified Windows download
        run: python tools/release/package_windows.py --build ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-build-logs
          path: build/*.log

  linux:
    name: Linux launcher and game
    runs-on: ubuntu-22.04
    if: github.event.inputs.tag == ''
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache: false
      - name: Test Linux launcher and both updater platforms
        working-directory: launcher
        run: go test -race ./...
      - name: Test release packaging and promotion
        run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v
      - name: Build standalone Linux launcher
        working-directory: launcher
        run: |
          mkdir -p ../build/linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../build/StarfallLauncher ./cmd/starfall
      - uses: actions/cache@v4
        with:
          path: ~/starfall-godot-linux
          key: godot-linux-${{ env.GODOT_VERSION }}-v1
      - name: Install verified Linux export tools
        run: python3 tools/release/install_linux_tools.py
      - name: Import, export, and launch the Linux game
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee build/linux-import.log
          godot --headless --path . --export-release Linux build/linux/Starfall.x86_64 2>&1 | tee build/linux-export.log
          timeout 90 build/linux/Starfall.x86_64 --headless --quit-after 120 --log-file "$PWD/build/linux-smoke.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:' build/linux-import.log build/linux-export.log build/linux-smoke.log; then exit 1; fi
      - name: Package verified Linux download
        run: python3 tools/release/package_linux.py --build ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-client
          path: build/release-linux/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-build-logs
          path: build/linux-*.log

  # ---------------------------------------------------------------- build ---
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event.inputs.tag == ''
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # Priorities matter: outputs.version is the HIGHEST-priority tag, and
          # that is what the deploy job pins. type=raw defaults to 200 and
          # type=sha to 100, so without these the deploy would pin `latest` —
          # mutable, and useless to roll back to.
          tags: |
            type=sha,prefix=sha-,format=short,priority=900
            type=raw,value=latest,enable={{is_default_branch}},priority=100
          labels: |
            org.opencontainers.image.title=Starfall dedicated server
            org.opencontainers.image.description=Godot 4.5 arena server (queues + private lobby pool)

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo "- Tag: \`${{ steps.meta.outputs.version }}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo ""
            echo "Roll back to this build with:"
            echo '```'
            echo "gh workflow run deploy.yml --ref main -f tag=${{ steps.meta.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------- deploy ---
  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    needs: [build, windows, linux]
    # Only from main: a successful build or an explicit manual rollback tag.
    if: |
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      ((needs.build.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''))
    timeout-minutes: 15
    # Attach required reviewers / branch restrictions to this environment in
    # repo settings; that is what gates who can push to production.
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag to deploy
        id: target
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then tag="${{ needs.build.outputs.tag }}"; fi
          if [ -z "$tag" ]; then echo "No tag to deploy." >&2; exit 1; fi
          # Reject anything that is not a plain tag before it reaches the shell.
          case "$tag" in
            *[!A-Za-z0-9._-]*) echo "Refusing suspicious tag: $tag" >&2; exit 1 ;;
          esac
          # Guard the promise above: an automatic deploy must never pin a
          # mutable tag. A human asking for it by hand is their call.
          if [ "$tag" = "latest" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Refusing to auto-deploy the mutable tag 'latest' — check the tag priorities in the metadata step." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $tag"

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          # Pinned host key — never StrictHostKeyChecking=no, which would accept
          # a man-in-the-middle on first contact and on any key change.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts

      - uses: actions/download-artifact@v4
        if: github.event.inputs.tag == ''
        with:
          name: windows-client
          path: build/release

      - uses: actions/download-artifact@v4
        if: github.event.inputs.tag == ''
        with:
          name: linux-client
          path: build/release-linux

      - name: Ship server configuration and release tools
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes "${USER_NAME}@${HOST}" \
            'set -e; mkdir -p /opt/starfall/deploy /opt/starfall/downloads /opt/starfall/incoming-windows /opt/starfall/incoming-linux; if test -f /opt/starfall/docker-compose.yml; then cp /opt/starfall/docker-compose.yml /opt/starfall/.last-compose.yml; fi; if test -f /opt/starfall/deploy/Caddyfile; then cp /opt/starfall/deploy/Caddyfile /opt/starfall/.last-Caddyfile; fi'
          scp -o StrictHostKeyChecking=yes docker-compose.yml \
            "${USER_NAME}@${HOST}:/opt/starfall/docker-compose.yml"
          scp -o StrictHostKeyChecking=yes deploy/publish_windows.py \
            "${USER_NAME}@${HOST}:/opt/starfall/"
          scp -o StrictHostKeyChecking=yes deploy/Caddyfile deploy/enable-downloads.sh deploy/install-retention.sh deploy/image_retention.py \
            "${USER_NAME}@${HOST}:/opt/starfall/deploy/"

      - name: Stage Windows release
        if: github.event.inputs.tag == ''
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=yes build/release/* \
            "${USER_NAME}@${HOST}:/opt/starfall/incoming-windows/"
          ssh -o StrictHostKeyChecking=yes "${USER_NAME}@${HOST}" \
            "python3 /opt/starfall/publish_windows.py stage --source /opt/starfall/incoming-windows --tag '${TAG}'"

      - name: Stage Linux release
        if: github.event.inputs.tag == ''
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=yes build/release-linux/* \
            "${USER_NAME}@${HOST}:/opt/starfall/incoming-linux/"
          ssh -o StrictHostKeyChecking=yes "${USER_NAME}@${HOST}" \
            "python3 /opt/starfall/publish_windows.py stage --platform linux --source /opt/starfall/incoming-linux --tag '${TAG}'"

      - name: Pin tag, pull, and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes "${USER_NAME}@${HOST}" \
            "TAG='${TAG}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/starfall
          test -f .env || { echo "/opt/starfall/.env is missing — run deploy/bootstrap.sh"; exit 1; }
          # Fail before changing the server if this rollback has no matching
          # clients. Never leave players auto-updating to another build.
          python3 publish_windows.py verify --tag "$TAG"
          python3 publish_windows.py verify --platform linux --tag "$TAG"

          # Record what we are replacing so a rollback has something to name.
          previous=$(grep -E '^STARFALL_TAG=' .env | cut -d= -f2- || true)
          echo "previous tag: ${previous:-<unset>}"
          echo "$previous" > .last-tag

          rollback_failed_deploy() {
            trap - ERR
            echo "Deployment failed; restoring the previous server configuration." >&2
            cp .before-windows-deploy.env .env
            if test -f .last-compose.yml; then cp .last-compose.yml docker-compose.yml; fi
            if test -f .last-Caddyfile; then cp .last-Caddyfile deploy/Caddyfile; fi
            if ! sudo /usr/local/bin/starfall-deploy; then
              echo "Automatic server rollback failed; operator attention required." >&2
            fi
            # The previous public feed remains untouched unless promotion had
            # succeeded. Restore it as well if a matching release is retained.
            if test -n "$previous" && test -f "downloads/releases/${previous}/manifest.json"; then
              python3 publish_windows.py promote --tag "$previous" || true
            fi
            if test -n "$previous" && test -f "downloads/linux/releases/${previous}/manifest.json"; then
              python3 publish_windows.py promote --platform linux --tag "$previous" || true
            else
              # First Linux deployment rolled back to a Windows-only release.
              # Do not advertise a Linux build for a different server.
              rm -f downloads/linux/manifest.json
            fi
            exit 1
          }
          cp .env .before-windows-deploy.env
          trap rollback_failed_deploy ERR

          # Rewrite only the tag line; the operator owns everything else in .env.
          if grep -qE '^STARFALL_TAG=' .env; then
            sed -i "s|^STARFALL_TAG=.*|STARFALL_TAG=${TAG}|" .env
          else
            echo "STARFALL_TAG=${TAG}" >> .env
          fi

          sudo /usr/local/bin/starfall-deploy
          # Check the public TLS/download path before advertising this version.
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 25 \
            "https://play.leafmods.com/downloads/releases/${TAG}/manifest.json" -o /tmp/starfall-release-check.json
          cmp /tmp/starfall-release-check.json "downloads/releases/${TAG}/manifest.json"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 25 \
            "https://play.leafmods.com/downloads/linux/releases/${TAG}/manifest.json" -o /tmp/starfall-linux-release-check.json
          cmp /tmp/starfall-linux-release-check.json "downloads/linux/releases/${TAG}/manifest.json"
          python3 publish_windows.py promote --tag "$TAG"
          python3 publish_windows.py promote --platform linux --tag "$TAG"
          trap - ERR
          REMOTE

      - name: Report deployed state
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          # starfall-deploy already gated on health and failed the step above if
          # the stack did not come up. This is the human-readable record.
          ssh -o StrictHostKeyChecking=yes "${USER_NAME}@${HOST}" \
            'sudo /usr/local/bin/starfall-status 20' | tee state.txt
          {
            echo "### Deployed \`${{ steps.target.outputs.tag }}\`"
            echo "Windows launcher: https://play.leafmods.com/downloads/StarfallLauncher.exe"
            echo "Linux launcher: https://play.leafmods.com/downloads/linux/StarfallLauncher"
            echo ""
            echo '```'
            head -40 state.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
