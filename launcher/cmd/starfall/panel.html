<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starfall Launcher</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#100f1a;color:#eeeaf9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 70% 10%,#322047 0,transparent 60%)}main{width:min(640px,calc(100% - 40px));padding:48px;border:1px solid #ffffff19;border-radius:24px;background:#191623e8;box-shadow:0 30px 100px #0005}.eyebrow{color:#c8abf7;font-size:12px;letter-spacing:3px;text-transform:uppercase}h1{font-size:clamp(36px,7vw,56px);letter-spacing:5px;margin:14px 0 4px}p{line-height:1.6;color:#bcb4ce}.tagline{margin-top:0}#version{font-size:13px;color:#a493bd;margin-top:36px}#message{min-height:64px;margin-bottom:16px;color:#eeeaf9}progress{width:100%;height:7px;accent-color:#bf8bff;border:0;border-radius:4px;background:#393044}progress::-webkit-progress-bar{background:#393044;border-radius:4px}progress::-webkit-progress-value{background:#bf8bff;border-radius:4px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}button{font:inherit;font-weight:600;border:1px solid #ffffff25;border-radius:10px;padding:14px 20px;background:#30273f;color:#f1eafc;cursor:pointer}button.primary{background:#c9a0ff;color:#211430;flex:1}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #ede1ff;outline-offset:3px}button:hover:enabled{filter:brightness(1.12)}footer{margin-top:30px;display:flex;align-items:center;gap:12px;justify-content:space-between}footer p{font-size:12px;margin:0}#quit{font-size:12px;background:none;border:0;padding:8px;white-space:nowrap}#offline-note{font-size:13px;color:#e6c58c}[hidden]{display:none!important}@media(max-width:480px){main{padding:28px}footer{align-items:flex-start}}
</style>
<main><div class="eyebrow">Linux edition · Cosmic gladiators</div><h1>STARFALL</h1><p class="tagline">One arena. Your next fight.</p><div id="version">Preparing your game</div><p id="message" role="status" aria-live="polite">Connecting to your launcher…</p><progress id="progress" max="100" value="0" aria-label="Update progress"></progress><div class="actions"><button class="primary" id="play" disabled>Play</button><button id="check" disabled>Check updates</button><button id="installed" hidden>Play installed version</button></div><p id="offline-note" hidden>Updates are unavailable. Your installed game can still be played offline; online play may require the latest version.</p><footer><p>Updates keep your keybinds, HUD layout, and settings.</p><button id="quit">Quit launcher</button></footer></main>
<script>
const el=id=>document.getElementById(id);let stopped=false;
async function action(name){try{const r=await fetch(name,{method:'POST'});if(!r.ok)throw Error(await r.text());if(name==='quit'){stopped=true;el('message').textContent='Launcher closed. You can close this tab.';document.querySelectorAll('button').forEach(b=>b.disabled=true);}else await refresh();}catch(e){el('message').textContent=e.message;}}
for(const name of ['play','check','installed','quit'])el(name).onclick=()=>action(name);
async function refresh(){if(stopped)return;try{const r=await fetch('status');if(!r.ok)throw Error();const s=await r.json();el('message').textContent=s.message;el('version').textContent=s.version?'Installed: '+s.version:'Linux x86-64';el('progress').value=s.percent;el('play').disabled=s.busy||!s.installed||s.failed;el('play').textContent=s.running?'Playing':s.busy?'Updating…':'Play';el('check').disabled=s.busy;el('installed').hidden=!s.failed||!s.installed;el('installed').disabled=s.busy;el('offline-note').hidden=!s.failed||!s.installed;el('quit').disabled=s.running;}catch{stopped=true;el('message').textContent='Launcher closed. Open the StarfallLauncher file to reconnect.';document.querySelectorAll('button').forEach(b=>b.disabled=true);}}
refresh();setInterval(refresh,1500);
</script></html>
